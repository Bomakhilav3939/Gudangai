name: Hermes Agent Worker & Memory Backup

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      enable_ssh:
        description: 'Buka Remote SSH (tmate) untuk setup/debugging manual via Termux'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  hermes-worker:
    name: Run Hermes Worker
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max ~5 hours 50 mins (safely under GitHub's 360-minute limit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore & Cache Hermes Memory
        uses: actions/cache@v4
        with:
          path: |
            ./hermes-data
            ./*.json
            ./*.sqlite
          key: hermes-memory-${{ github.run_id }}
          restore-keys: |
            hermes-memory-

      - name: Prepare Hermes Environment
        run: |
          mkdir -p ./hermes-data
          if [ -d "./hermes-data" ]; then
            echo "Memory & artifacts directory restored."
            ls -la ./hermes-data || true
          fi

      - name: Interactive Remote Terminal (SSH / tmate)
        if: ${{ inputs.enable_ssh == true }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false

      - name: Run Hermes Agent Worker
        env:
          HERMES_DATA_PATH: ./hermes-data
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting Hermes agent worker process..."
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "index.js" ]; then
            node index.js
          else
            echo "Hermes worker running... (Custom agent command goes here)"
          fi

      - name: Backup Memory Artifacts
        if: always() # Always run this step even if job times out or fails
        uses: actions/upload-artifact@v4
        with:
          name: hermes-memory-artifacts-${{ github.run_number }}
          path: |
            ./hermes-data
            ./*.json
            ./*.sqlite
            !node_modules
            !.git
          retention-days: 90
          overwrite: true
